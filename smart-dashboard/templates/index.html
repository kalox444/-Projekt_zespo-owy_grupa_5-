<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="60">
    <title>Dashboard</title>
    <style>
        body {
            background: #18191a;
            color: #e4e6eb;
            font-family: sans-serif;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .box {
            background: #242526;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #3a3b3c;
        }
        h2 { margin-top: 0; color: #b0b3b8; font-size: 16px; }
        .temp { font-size: 48px; font-weight: bold; }
        ul { padding-left: 20px; line-height: 1.8; }
    </style>
</head>
<body>

    <div class="box">
        <h2>POGODA (Żukowo, {{ godzina }})</h2>
        <div class="temp">{{ temp }}°C</div>
        <p style="color: #b0b3b8; margin-bottom: 0;">Ciśnienie: <b>{{ cisnienie }} hPa</b></p>
    </div>

    <div class="box">
        <h2>KALENDARZ</h2>
        <ul>
            <li>{{ kalendarz[0] }}</li>
            <li>{{ kalendarz[1] }}</li>
            <li>{{ kalendarz[2] }}</li>
            <li>{{ kalendarz[3] }}</li>
        </ul>
    </div>

    <div class="box" style="grid-column: span 2;">
        <h2>POCIĄGI</h2>
        <ul>
            <li>{{ pociagi[0] }}</li>
            <li>{{ pociagi[1] }}</li>
            <li>{{ pociagi[2] }}</li>
            <li>{{ pociagi[3] }}</li>
        </ul>
    </div>


    <div class="box" style="grid-column: span 2; height: 380px; padding: 10px;">
        <h2 style="margin: 10px 0 10px 10px;">Żukowo ruch drogowy</h2>
        <iframe 
            width="100%" 
            height="310px" 
            style="border:0; border-radius: 8px;" 
            loading="lazy" 
            allowfullscreen 
            src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d12000.12345!2d18.35!3d54.341!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1zAFJ1Y2ggZHJvZ293eSBuxqV6WWhva28gR2RhxYRzaw!5e0!3m2!1spl!2spl!4v1700000000000!5m2!1spl!2spl">
        </iframe>
    </div>

</body>
</html>
